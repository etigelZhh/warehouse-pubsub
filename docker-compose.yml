x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/inventory
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"

  inventory_api:
    <<: *app
    command: python -m inventory_api
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  analytics_worker:
    <<: *app
    command: python -m analytics_worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  tests:
    <<: *app
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/inventory_test
      REDIS_URL: redis://redis:6379/15
    command: pytest -v
